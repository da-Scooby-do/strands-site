<!-- @dsCard group="Colors" viewport="700x200" name="Grounds" subtitle="Cream default, alternating with pale green and purple tint" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:22px 24px;background:var(--white);font-family:var(--font-sans)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}</style></head><body><div class="g">
<div style="display:grid;gap:8px"><div style="height:74px;border-radius:8px;background:#FBF6EE;border:1px solid rgba(0,0,0,.06)"></div><div style="font-size:12px;letter-spacing:.02em">Cream</div><div style="font-family:var(--font-numeric);font-size:11px;color:var(--ink-2)">#FBF6EE</div><div style="font-size:10px;color:var(--ink-2);line-height:1.4">The default page ground — warm, never pure white.</div></div>
<div style="display:grid;gap:8px"><div style="height:74px;border-radius:8px;background:#EDF0E7;border:1px solid rgba(0,0,0,.06)"></div><div style="font-size:12px;letter-spacing:.02em">Green tint</div><div style="font-family:var(--font-numeric);font-size:11px;color:var(--ink-2)">#EDF0E7</div><div style="font-size:10px;color:var(--ink-2);line-height:1.4">Alternating pale section grounds, claim cards.</div></div>
<div style="display:grid;gap:8px"><div style="height:74px;border-radius:8px;background:#F1EAF2;border:1px solid rgba(0,0,0,.06)"></div><div style="font-size:12px;letter-spacing:.02em">Purple tint</div><div style="font-family:var(--font-numeric);font-size:11px;color:var(--ink-2)">#F1EAF2</div><div style="font-size:10px;color:var(--ink-2);line-height:1.4">Product-image grounds, quiet panels.</div></div>
<div style="display:grid;gap:8px"><div style="height:74px;border-radius:8px;background:#FFFFFF;border:1px solid rgba(0,0,0,.06)"></div><div style="font-size:12px;letter-spacing:.02em">White</div><div style="font-family:var(--font-numeric);font-size:11px;color:var(--ink-2)">#FFFFFF</div><div style="font-size:10px;color:var(--ink-2);line-height:1.4">Cards and inputs. All body text set on purple.</div></div>
</div></body></html>
