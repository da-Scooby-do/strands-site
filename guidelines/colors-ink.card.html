<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:22px 24px;background:var(--cream);font-family:var(--font-sans)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}</style></head><body><div class="g">
<div style="display:grid;gap:8px"><div style="height:74px;border-radius:8px;background:#2A2130;border:1px solid rgba(0,0,0,.06)"></div><div style="font-size:12px;letter-spacing:.02em">Ink</div><div style="font-family:var(--font-numeric);font-size:11px;color:var(--ink-2)">#2A2130</div><div style="font-size:10px;color:var(--ink-2);line-height:1.4">Body text.</div></div>
<div style="display:grid;gap:8px"><div style="height:74px;border-radius:8px;background:#615468;border:1px solid rgba(0,0,0,.06)"></div><div style="font-size:12px;letter-spacing:.02em">Ink 2</div><div style="font-family:var(--font-numeric);font-size:11px;color:var(--ink-2)">#615468</div><div style="font-size:10px;color:var(--ink-2);line-height:1.4">Secondary text, axis labels, captions.</div></div>
<div style="display:grid;gap:8px"><div style="height:74px;border-radius:8px;background:#231F20;border:1px solid rgba(0,0,0,.06)"></div><div style="font-size:12px;letter-spacing:.02em">Near-black</div><div style="font-family:var(--font-numeric);font-size:11px;color:var(--ink-2)">#231F20</div><div style="font-size:10px;color:var(--ink-2);line-height:1.4">Fine print only — packaging legal text.</div></div>
<div style="display:grid;gap:8px"><div style="height:74px;border-radius:8px;background:#E6D9CB;border:1px solid rgba(0,0,0,.06)"></div><div style="font-size:12px;letter-spacing:.02em">Rule</div><div style="font-family:var(--font-numeric);font-size:11px;color:var(--ink-2)">#E6D9CB</div><div style="font-size:10px;color:var(--ink-2);line-height:1.4">1px hairlines. Separation is by ground and hairline, never shadow.</div></div>
</div></body></html>
