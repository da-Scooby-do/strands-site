<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--cream);font-family:var(--font-sans);font-size:12px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.b{border-radius:12px;padding:16px;height:104px;display:grid;align-content:space-between}.n{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}</style></head><body><div class="g">
<div class="b" style="background:var(--white);border:1px solid var(--rule)"><span class="n" style="color:var(--green)">Green on white</span><span style="font-family:var(--font-display);font-size:22px;color:var(--green);letter-spacing:.12em">STRANDS</span></div>
<div class="b" style="background:var(--purple)"><span class="n" style="color:var(--lilac)">Green on purple</span><span style="font-family:var(--font-display);font-size:22px;color:var(--green);letter-spacing:.12em">STRANDS</span></div>
<div class="b" style="background:var(--purple)"><span class="n" style="color:var(--lilac)">Text on purple</span><span style="color:var(--white)">White body · <span style="color:var(--lilac)">lilac secondary</span></span></div>
<div class="b" style="background:var(--green-tint)"><span class="n" style="color:var(--green)">Green tint</span><span style="color:var(--ink)">Ink body on pale green.</span></div>
</div></body></html>
