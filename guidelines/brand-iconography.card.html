<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:22px 24px;background:var(--cream);font-family:var(--font-sans)}</style><script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.js"></script></head><body>
<div style="display:flex;gap:22px;align-items:center;color:var(--green-bright)">
<i data-lucide="droplet"></i><i data-lucide="sparkles"></i><i data-lucide="leaf"></i><i data-lucide="clock"></i><i data-lucide="truck"></i><i data-lucide="shield-check"></i><i data-lucide="flask-conical"></i><i data-lucide="shopping-bag"></i><i data-lucide="user"></i><i data-lucide="search"></i><i data-lucide="chevron-down"></i><i data-lucide="thumbs-up"></i>
</div>
<div style="margin-top:16px;font-size:11px;color:var(--ink-2)">One green everywhere: <code>--icon-on-light</code> and <code>--icon-on-anchor</code> both resolve to <code>--green-bright</code>, the brand green lifted enough to hold on purple. Circled feature icons draw at 2.75 stroke, UI chrome at 1.5. Never emoji, never filled icon sets.</div>
<script>lucide.createIcons({attrs:{width:22,height:22,'stroke-width':2.75}})</script></body></html>
