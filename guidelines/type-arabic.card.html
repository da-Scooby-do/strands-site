<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--cream);font-family:var(--font-sans)}</style></head><body>
<div style="display:grid;gap:14px;max-width:60ch">
<p style="font-size:15px;line-height:1.7">Apply to damp hair, leave for up to 2 hours, then shampoo.</p>
<hr style="border:none;border-top:1px solid var(--rule);margin:0">
<p dir="rtl" style="font-family:var(--font-arabic);font-size:15px;line-height:1.9;color:var(--ink)">على شعر رطب، ضعي كمية مناسبة من الماسك على كامل الشعر، واتركيه لمدة ساعة إلى ساعتين، ثم اغسليه بالشامبو.</p>
<div style="font-size:11px;color:var(--ink-2)">Noto Kufi Arabic, matched in weight to the English. Never formal MSA.</div>
</div></body></html>
