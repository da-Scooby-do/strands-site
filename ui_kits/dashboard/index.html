<!-- @dsCard group="Dashboard" viewport="1280x900" name="Owner dashboard" subtitle="Sign in, then the eight admin screens" -->
<!-- @startingPoint section="Dashboard" subtitle="Single-owner store admin — orders, product, promos, emails" viewport="1280x900" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Strands — dashboard</title><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.js"></script><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0}</style></head><body><div id="root"></div>
<script type="text/babel" src="responsive.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="Login.jsx"></script>
<script type="text/babel" src="Overview.jsx"></script>
<script type="text/babel" src="Orders.jsx"></script>
<script type="text/babel" src="OrderDetail.jsx"></script>
<script type="text/babel" src="Product.jsx"></script>
<script type="text/babel" src="Promos.jsx"></script>
<script type="text/babel" src="ReviewQuotes.jsx"></script>
<script type="text/babel" src="Waitlist.jsx"></script>
<script type="text/babel" src="Emails.jsx"></script>
<script type="text/babel" data-presets="react">
function App(){
  const [signedIn,setSignedIn]=React.useState(false);
  const [page,setPage]=React.useState("Overview");
  const [orders,setOrders]=React.useState(window.DASH.ORDERS);
  const [openId,setOpenId]=React.useState(null);
  const order=orders.find(o=>o.id===openId);
  const move=(id,status)=>setOrders(os=>os.map(o=>o.id===id?{...o,status}:o));
  const advance=()=>{const F=window.DASH.FLOW;move(order.id,F[Math.min(F.length-1,F.indexOf(order.status)+1)]);};
  if(!signedIn) return <window.DashLogin onSignIn={()=>setSignedIn(true)}/>;
  const go=(p)=>{setOpenId(null);setPage(p);};
  let body;
  if(openId&&order) body=<window.DashOrderDetail order={order} onBack={()=>setOpenId(null)} onAdvance={advance} onCancel={()=>move(order.id,"Cancelled")}/>;
  else if(page==="Overview") body=<window.DashOverview orders={orders} onOpen={o=>{setPage("Orders");setOpenId(o.id);}} goOrders={()=>go("Orders")}/>;
  else if(page==="Orders") body=<window.DashOrders orders={orders} onOpen={o=>setOpenId(o.id)}/>;
  else if(page==="Product & bundles") body=<window.DashProduct/>;
  else if(page==="Promo codes") body=<window.DashPromos/>;
  else if(page==="Reviews") body=<window.DashReviews/>;
  else if(page==="Gulf waitlist") body=<window.DashWaitlist/>;
  else body=<window.DashEmails/>;
  return <window.DashShell page={page} setPage={go} onSignOut={()=>{setSignedIn(false);setPage("Overview");setOpenId(null);}}>{body}</window.DashShell>;
}
const mount=()=>{ if(!window.DashEmails||!window.DASH){return setTimeout(mount,60);} ReactDOM.createRoot(document.getElementById('root')).render(<App/>); };
mount();
</script></body></html>
