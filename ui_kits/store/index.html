<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Strands — Velvet Touch Masque</title><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.js"></script><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.114.0/dist/umd/supabase.js"></script><script src="../../_ds_bundle.js"></script><script src="../../_supabase.js"></script>
<style>html,body{margin:0}#root{min-height:100vh}@keyframes strands-strip{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,-50%,0)}}@media (prefers-reduced-motion:reduce){[style*="strands-strip"]{animation:none!important}}</style></head><body><div id="root"></div>
<script type="text/babel" src="responsive.jsx"></script>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Statement.jsx"></script>
<script type="text/babel" src="ClaimSplit.jsx"></script>
<script type="text/babel" src="PhotoStrip.jsx"></script>
<script type="text/babel" src="OverTime.jsx"></script>
<script type="text/babel" src="Science.jsx"></script>
<script type="text/babel" src="Compare.jsx"></script>
<script type="text/babel" src="Standards.jsx"></script>
<script type="text/babel" src="Reviews.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel" src="Checkout.jsx"></script>
<script type="text/babel" data-presets="react">
window.DSButton = window.StrandsDesignSystem_6d0a65.Button;
function Page(){
  const phone=window.useIsPhone();
  const [cart,setCart]=React.useState(0);
  const [added,setAdded]=React.useState(false);
  const [lang,setLang]=React.useState("EN");
  const [coOpen,setCoOpen]=React.useState(false);
  const [coVariant,setCoVariant]=React.useState("1jar");
  const [product,setProduct]=React.useState(null);
  const [variants,setVariants]=React.useState(null);
  const [ship,setShip]=React.useState(null);
  React.useEffect(()=>{ if(!window.SB_READY) return; (async()=>{
    const [p,v,s]=await Promise.all([
      window.sb.from("products").select("*").eq("active",true).order("created_at").limit(1).maybeSingle(),
      window.sb.from("product_variants").select("*").eq("active",true).order("sort"),
      window.sb.from("settings").select("value").eq("key","shipping").maybeSingle(),
    ]);
    if(p.data) setProduct(p.data);
    if(v.data) setVariants(v.data);
    if(s.data&&s.data.value) setShip(s.data.value);
  })(); },[]);
  const v1=(variants||[]).find(v=>v.jars===1)||(variants||[])[0];
  const add=(vk)=>{setCoVariant(typeof vk==="string"?vk:"1jar");setCoOpen(true);setCart(c=>c+1);};
  return <div data-scroll-root style={{background:'var(--cream)'}}>
    <window.StrandsCheckout open={coOpen} onClose={()=>setCoOpen(false)} initialVariant={coVariant} variants={variants} ship={ship}/>
    <window.StrandsHeader onBuy={add} cart={cart} lang={lang} setLang={setLang}/>
    <window.StrandsHero onAdd={add} added={added} product={product} variants={variants}/>
    <window.StrandsStatement/>
    <window.StrandsClaimSplit/>
    <window.StrandsOverTime/>
    <window.StrandsScience/>
    <window.StrandsCompare/>
    <window.StrandsStandards/>
    <window.StrandsReviews/>
    <window.StrandsFooter/>
    {phone && <div style={{position:'fixed',insetInline:0,bottom:0,zIndex:30,background:'var(--cream)',borderTop:'1px solid var(--rule)',padding:'10px var(--gutter)',display:'flex',alignItems:'center',gap:'var(--space-4)'}}>
      <div style={{display:'grid'}}><span style={{fontFamily:'var(--font-numeric)',fontSize:18,fontWeight:500}}>{v1?((v1.price_egp|0).toLocaleString('en-US')+' EGP'):'—'}</span><span style={{fontSize:11,color:'var(--ink-2)'}}>Cash on delivery</span></div>
      <div style={{flex:1}}><window.DSButton fullWidth onClick={()=>add(v1?v1.key:"1jar")}>Add to cart</window.DSButton></div>
    </div>}
    {phone && <div style={{height:76}}/>}
  </div>;
}
const mount=()=>{ if(!window.StrandsFooter||!window.StrandsPhotoStrip){return setTimeout(mount,60);} ReactDOM.createRoot(document.getElementById('root')).render(<Page/>); };
mount();
</script></body></html>
