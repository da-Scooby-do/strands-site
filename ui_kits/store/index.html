<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Strands — Velvet Touch Masque</title><link rel="preconnect" href="https://unpkg.com" crossorigin><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="preload" as="image" href="../../assets/photography/jar-in-hands.jpg" fetchpriority="high"><link rel="icon" type="image/svg+xml" href="../../assets/brand/emblem.svg"><link rel="icon" type="image/png" href="../../assets/brand/emblem-512.png"><link rel="apple-touch-icon" href="../../assets/brand/emblem-512.png"><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.js"></script><script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.114.0/dist/umd/supabase.js"></script><script src="../../_ds_bundle.js"></script><script src="../../_supabase.js"></script><script src="../../i18n.js"></script><script src="../../content.js"></script>
<style>html,body{margin:0;overflow-x:clip;max-width:100%}#root{min-height:100vh;overflow-x:clip}img,svg,video{max-width:100%}@keyframes strands-strip{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,-50%,0)}}
@keyframes strands-strip-x{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}@media (prefers-reduced-motion:reduce){[style*="strands-strip"]{animation:none!important}}
/* Arabic: Cairo already covers Arabic across the UI. Only the display serif
   (Aquilla) lacks Arabic, so swap it to Cairo for Arabic headings. RTL via dir. */
:root[lang="ar"]{
  --font-display:"Cairo","Noto Kufi Arabic",serif;
  --font-sans:"Cairo",system-ui,sans-serif;
  --font-numeric:"Cairo",system-ui,sans-serif;
}
/* Brand-green gradient (dégradé) for display headings on light grounds. */
.strands-hgrad{
  background:linear-gradient(96deg,#45562F 0%,#5D733F 52%,#7C9455 100%);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
}
@supports not ((-webkit-background-clip:text) or (background-clip:text)){
  .strands-hgrad{color:var(--green);-webkit-text-fill-color:currentColor;background:none}
}
.strands-review-track::-webkit-scrollbar{display:none}
/* Phone: keep the hero product column from being forced wide by the gallery's
   thumbnail strip (its 5 thumbs have a min-content wider than the screen). */
@media (max-width:760px){
  #the-masque{grid-template-columns:minmax(0,1fr)!important}
  #the-masque>div{min-width:0}
  #the-masque>div:first-child>div{min-width:0}
  #the-masque>div:first-child>div:last-child{overflow-x:auto;scrollbar-width:none}
  #the-masque>div:first-child>div:last-child::-webkit-scrollbar{display:none}
}</style></head><body><div id="root"></div>
<script type="text/babel" src="responsive.jsx"></script>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Statement.jsx"></script><script type="text/babel" src="PhotoStrip.jsx"></script>
<script type="text/babel" src="OverTime.jsx"></script>
<script type="text/babel" src="Science.jsx"></script><script type="text/babel" src="Standards.jsx"></script>
<script type="text/babel" src="Reviews.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel" src="Checkout.jsx"></script>
<script type="text/babel" data-presets="react">
window.DSButton = window.StrandsDesignSystem_6d0a65.Button;
const CART_KEY="strands-cart";
function loadCart(){ try{ const v=JSON.parse(localStorage.getItem(CART_KEY)); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
function Page(){
  const phone=window.useIsPhone();
  const lang=window.useLang();
  const [coOpen,setCoOpen]=React.useState(()=>{ try{ return new URLSearchParams(location.search).get("checkout")==="1"; }catch(e){ return false; } });
  const [product,setProduct]=React.useState(null);
  const [variants,setVariants]=React.useState(null);
  const [ship,setShip]=React.useState(null);
  const [dataStatus,setDataStatus]=React.useState("loading"); // loading | ok | error
  const [reloadKey,setReloadKey]=React.useState(0);
  const [cart,setCart]=React.useState(loadCart);
  React.useEffect(()=>{ try{ localStorage.setItem(CART_KEY,JSON.stringify(cart)); }catch(e){} },[cart]);
  React.useEffect(()=>{
    if(!window.SB_READY){ setDataStatus("error"); return; }
    let live=true; setDataStatus("loading");
    // Run each query up to n times with backoff, and NEVER let one reject take the
    // others down (the old Promise.all silently blanked price + product on any 3G hiccup).
    const attempt=async(fn,n)=>{ let last; for(let i=0;i<n;i++){ try{ const r=await fn(); if(r&&!r.error) return r; last=r; }catch(e){ last={error:e}; } if(i<n-1) await new Promise(res=>setTimeout(res,600*(i+1))); } return last||{error:true}; };
    const qProduct=()=>window.sb.from("products").select("*").eq("active",true).order("created_at").limit(1).maybeSingle();
    const qVariants=()=>window.sb.from("product_variants").select("*").eq("active",true).order("sort");
    const qShip=()=>window.sb.from("settings").select("value").eq("key","shipping").maybeSingle();
    (async()=>{
      const [p,v,s]=await Promise.all([ attempt(qProduct,3), attempt(qVariants,3), attempt(qShip,2) ]);
      if(!live) return;
      if(p&&p.data) setProduct(p.data);
      if(v&&v.data) setVariants(v.data);
      if(s&&s.data&&s.data.value) setShip(s.data.value);
      // "ok" as long as a price source loaded (an active variant, or a product fallback price).
      const ok=(v&&Array.isArray(v.data)&&v.data.length>0)||(p&&p.data&&p.data.price_egp!=null);
      setDataStatus(ok?"ok":"error");
    })();
    return ()=>{ live=false; };
  },[reloadKey]);
  const v1=(variants||[]).find(v=>v.jars===1)||(variants||[])[0];
  const count=cart.reduce((a,c)=>a+c.qty,0);
  const addToCart=(key,qty)=>{ key=key||"1jar"; qty=qty||1; setCart(cs=>{ const i=cs.findIndex(c=>c.key===key); if(i>=0){ const n=cs.slice(); n[i]={...n[i],qty:n[i].qty+qty}; return n; } return [...cs,{key,qty}]; }); };
  const setQty=(key,qty)=>setCart(cs=>qty<=0?cs.filter(c=>c.key!==key):cs.map(c=>c.key===key?{...c,qty}:c));
  const removeItem=(key)=>setCart(cs=>cs.filter(c=>c.key!==key));
  const clearCart=()=>setCart([]);
  const add=(vk)=>{ addToCart(typeof vk==="string"?vk:"1jar",1); setCoOpen(true); };
  return <div data-scroll-root style={{background:'var(--cream)'}}>
    {dataStatus==="error" && <div role="alert" style={{position:'sticky',top:0,zIndex:50,background:'#7A2E2E',color:'#fff',padding:'10px var(--gutter)',display:'flex',alignItems:'center',justifyContent:'center',gap:14,flexWrap:'wrap',fontSize:14,fontFamily:'var(--font-sans)'}}>
      <span>{window.copy('store.loadError',"We couldn’t load the latest product details.","تعذّر تحميل تفاصيل المنتج.")}</span>
      <button type="button" onClick={()=>setReloadKey(k=>k+1)} style={{background:'#fff',color:'#7A2E2E',border:'none',borderRadius:6,padding:'6px 16px',fontWeight:700,cursor:'pointer',font:'inherit',fontFamily:'var(--font-sans)'}}>{window.copy('store.retry','Retry','إعادة المحاولة')}</button>
    </div>}
    <window.StrandsCheckout open={coOpen} onClose={()=>setCoOpen(false)} cart={cart} variants={variants} ship={ship} onSetQty={setQty} onRemove={removeItem} onClear={clearCart}/>
    <window.StrandsHeader onBuy={add} onCart={()=>setCoOpen(true)} cart={count}/>
    <window.StrandsHero onAdd={add} product={product} variants={variants} status={dataStatus}/>
    <window.StrandsStatement/>
    <window.StrandsOverTime/>
    <window.StrandsScience/>
    <window.StrandsStandards/>
    <window.StrandsReviews/>
    <window.StrandsFooter/>
    {phone && <div style={{position:'fixed',insetInline:0,bottom:0,zIndex:30,background:'var(--cream)',borderTop:'1px solid var(--rule)',padding:'10px var(--gutter)',display:'flex',alignItems:'center',gap:'var(--space-4)'}}>
      <div style={{display:'grid'}}><span style={{fontFamily:'var(--font-numeric)',fontSize:18,fontWeight:500}}>{v1?window.money(v1.price_egp):(dataStatus==="error"?'—':'…')}</span><span style={{fontSize:11,color:'var(--ink-2)'}}>{window.copy('hero.cod','Cash on delivery','الدفع عند الاستلام')}</span></div>
      <div style={{flex:1}}><window.DSButton fullWidth disabled={!v1} onClick={()=>add(v1?v1.key:"1jar")}>{window.copy('cta.add','Add to cart','أضيفي للسلة')}</window.DSButton></div>
    </div>}
    {phone && <div style={{height:76}}/>}
  </div>;
}
let _rendered=false;
const render=()=>{ if(_rendered) return; _rendered=true; ReactDOM.createRoot(document.getElementById('root')).render(<Page/>); };
const mount=()=>{ if(!window.StrandsFooter||!window.StrandsPhotoStrip){return setTimeout(mount,60);}
  // Load owner-edited copy (settings.content) before first paint so there's no flash.
  if(window.SB_READY){
    setTimeout(render, 2500); // safety: never leave the page blank if the query stalls
    window.sb.from("settings").select("value").eq("key","content").maybeSingle()
      .then(({data})=>{ if(data&&data.value) window.setSiteCopy(data.value); }, ()=>{})
      .then(render, render);
  } else render();
};
mount();
</script></body></html>
