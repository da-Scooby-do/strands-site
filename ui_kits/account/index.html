<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Strands — your account</title><link rel="icon" type="image/svg+xml" href="../../assets/brand/emblem.svg"><link rel="icon" type="image/png" href="../../assets/brand/emblem-512.png"><link rel="apple-touch-icon" href="../../assets/brand/emblem-512.png"><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.js"></script><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.114.0/dist/umd/supabase.js"></script><script src="../../_ds_bundle.js"></script><script src="../../_supabase.js"></script>
<style>html,body{margin:0;overflow-x:clip;max-width:100%}#root{overflow-x:clip}img,svg,video{max-width:100%}</style></head><body><div id="root"></div>
<script type="text/babel" src="../dashboard/responsive.jsx"></script>
<script type="text/babel" src="../dashboard/data.jsx"></script>
<script type="text/babel" src="../dashboard/Login.jsx"></script>
<script type="text/babel" src="AccountHeader.jsx"></script>
<script type="text/babel" src="OrderTimeline.jsx"></script>
<script type="text/babel" src="AccountOrders.jsx"></script>
<script type="text/babel" src="AccountDetails.jsx"></script>
<script type="text/babel" src="Account.jsx"></script>
<script type="text/babel" data-presets="react">
const ST_LABEL={placed:"Placed",confirmed:"Confirmed",packed:"Packed",with_courier:"With courier",delivered:"Delivered",cancelled:"Cancelled"};
function pad2(n){return (n<10?"0":"")+n;}
function fmtDate(d){try{const x=new Date(d);return pad2(x.getDate())+"/"+pad2(x.getMonth()+1)+"/"+x.getFullYear();}catch(e){return "";}}
function mapOrder(o){
  const items=(o.order_items||[]).map(i=>({n:i.title_en,q:i.qty,p:i.unit_price}));
  const dates={};
  (o.order_events||[]).forEach(e=>{ dates[ST_LABEL[e.status]||e.status]=fmtDate(e.created_at); });
  return {id:o.order_number,uuid:o.id,status:ST_LABEL[o.status]||o.status,items,shipping:o.shipping||0,discount:o.discount||0,
    placed:fmtDate(o.created_at),dates,street:o.street,area:o.area,gov:o.governorate,phone:o.phone};
}
function Splash({msg}){return <div style={{minHeight:"100vh",display:"grid",placeItems:"center",background:"var(--cream)",color:"var(--ink-2)",fontFamily:"var(--font-sans)"}}>{msg}</div>;}

function App(){
  const [ready,setReady]=React.useState(false);
  const [session,setSession]=React.useState(null);
  const [orders,setOrders]=React.useState([]);
  const [name,setName]=React.useState("");
  const [isOwner,setIsOwner]=React.useState(false);

  React.useEffect(()=>{
    if(!window.SB_READY){ setReady(true); return; }
    window.sb.auth.getSession().then(({data})=>{ setSession(data.session||null); setReady(true); });
    const {data:sub}=window.sb.auth.onAuthStateChange((_e,s)=>setSession(s||null));
    return ()=>{ sub&&sub.subscription&&sub.subscription.unsubscribe(); };
  },[]);

  React.useEffect(()=>{
    if(!session){ setOrders([]); setName(""); setIsOwner(false); return; }
    (async()=>{
      const uid=session.user.id;
      const [ord,prof,adm]=await Promise.all([
        window.sb.from("orders").select("*, order_items(*), order_events(*)").order("created_at",{ascending:false}),
        window.sb.from("profiles").select("full_name").eq("user_id",uid).maybeSingle(),
        window.sb.rpc("is_admin"),
      ]);
      if(ord.data) setOrders(ord.data.map(mapOrder));
      setName((prof.data&&prof.data.full_name)||session.user.email);
      setIsOwner(!adm.error && adm.data===true);
    })();
  },[session]);

  if(!ready) return <Splash msg="Loading…"/>;
  if(!window.SB_READY) return <Splash msg="Could not reach the database. Refresh to try again."/>;
  if(!session) return <window.DashLogin heading="Sign in to your account." onSignedIn={(s)=>setSession(s)}/>;
  return <window.StrandsAccount user={name} isOwner={isOwner} orders={orders}
    onDashboard={()=>{window.location.href="../dashboard/index.html";}}
    onSignOut={()=>window.sb.auth.signOut()}/>;
}
const mount=()=>{ if(!window.StrandsAccount||!window.DASH){return setTimeout(mount,60);} ReactDOM.createRoot(document.getElementById('root')).render(<App/>); };
mount();
</script></body></html>
